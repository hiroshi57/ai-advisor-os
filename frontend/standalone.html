<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>実データ入力版</b>：クライアントの<b>数えられる事実</b>（使った人数・部署数・到達段階・ルール整備数）を入力すると、<b>4指標とAI活用Indexを自動計算</b>し、業界内での位置・優先アクションを出します。主観の点数付けはしません。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
const FK=["利用・定着","活用の幅","活用の深さ","ガバナンス"];
const FKEY=["util","breadth","depth","gov"];
const IND=["IT","製造","広告","小売","金融","その他"];
const TIP={util:"WAU/継続率の底上げ：基礎研修と業務テンプレ配布",breadth:"ユースケースの横展開：部署横断で用途を拡張",depth:"定型→分析→意思決定へ：高度ユースケースを設計",gov:"利用ルール整備と全社周知：安全に使える体制"};

// ★4因子の定義と「どう測るか」。主観の点数付けをやめ、数えられる事実から自動算出する
const DEF=[
  {k:"利用・定着", q:"どれくらいの人が、継続して使っているか",
   how:"週1回以上AIを使った人数 ÷ 対象者数（＝WAU率）",
   calc:"WAU率をそのまま0〜100に換算", ex:"110名中66名が週1回以上使用 → 60点"},
  {k:"活用の幅", q:"社内の何割の部署に広がっているか",
   how:"AIを業務で使っている部署数 ÷ 全部署数",
   calc:"導入部署の割合を0〜100に換算", ex:"全8部署のうち4部署で使用 → 50点"},
  {k:"活用の深さ", q:"「調べる」で止まらず「任せる」まで進んでいるか",
   how:"用途を4段階で数える：①検索/相談 ②文書作成 ③分析・示唆 ④業務そのものを自動化",
   calc:"到達した最高段階 × 25点（例：③まで到達=75点）", ex:"分析までできている → 75点"},
  {k:"ガバナンス", q:"安全に使うルールが何項目整っているか",
   how:"必須10項目のチェック（利用ルール文書化／禁止事項の明示／機密入力の禁止／ログ取得／権限管理／教育実施／相談窓口／外部送信の可否判断／定期監査／インシデント手順）",
   calc:"整備できた項目数 × 10点", ex:"10項目中7項目 → 70点"},
];

// 生データ(数えられる事実)から4因子を自動計算
function derive(r){
  const util=r.users>0?Math.round(r.wauUsers/r.users*100):0;
  const breadth=r.depts>0?Math.round(r.useDepts/r.depts*100):0;
  const depth=Math.min(4,Math.max(0,r.stage))*25;
  const gov=Math.min(10,Math.max(0,r.govItems))*10;
  return {util:Math.min(100,util), breadth:Math.min(100,breadth), depth, gov};
}
const CL0=[
  {id:1,company:"デモ商事",       industry:"IT", users:110, wauUsers:66, depts:8, useDepts:4, stage:3, govItems:7},
  {id:2,company:"サンプル製作所", industry:"製造", users:250, wauUsers:100, depts:10, useDepts:3, stage:2, govItems:4},
  {id:3,company:"テスト広告",     industry:"広告", users:60, wauUsers:45, depts:5, useDepts:4, stage:3, govItems:7},
];
const STAGE=["未使用","①検索・相談","②文書作成","③分析・示唆","④業務の自動化"];
const idx=c=>Math.round((c.util+c.breadth+c.depth+c.gov)/4*10)/10;
const color=v=>v>=60?"#17a673":v>=40?"#f0a500":"#c0392b";
function tri(v){return v>=60?["良好","#17a673"]:v>=40?["要注視","#f0a500"]:["要介入","#c0392b"];}
function level(t){return t>=70?["先進","#0f7a54"]:t>=55?["標準以上","#17a673"]:t>=40?["平均並み","#f0a500"]:["要支援","#c0392b"];}

function Radar({own,median}){
  const cx=150,cy=145,R=100,N=4;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,ratio)=>[cx+Math.cos(ang(i))*R*ratio, cy+Math.sin(ang(i))*R*ratio];
  const poly=arr=>arr.map((v,i)=>pt(i,Math.max(0,Math.min(1,v/100))).join(",")).join(" ");
  return (<svg width="100%" viewBox="0 0 300 300" style={{maxWidth:340}}>
    {[0.33,0.66,1].map((rr,k)=>(<polygon key={k} points={FK.map((_,i)=>pt(i,rr).join(",")).join(" ")} fill="none" stroke="#eae7f0"/>))}
    {FK.map((_,i)=>{const[x,y]=pt(i,1);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#eae7f0"/>;})}
    <polygon points={poly(median)} fill="none" stroke="#8aa9d6" strokeWidth="2" strokeDasharray="4 3"/>
    <polygon points={poly(own)} fill="#6a4c9333" stroke="#6a4c93" strokeWidth="2.5"/>
    {FK.map((a,i)=>{const[x,y]=pt(i,1.18);return <text key={i} x={x} y={y} textAnchor="middle" fontSize="9.5" fill="#556">{a}</text>;})}
  </svg>);
}


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="advisor_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [clients,setClients]=usePersist("clients",CL0);
  const [sel,setSel]=React.useState(0);
  // 生データ→4因子を自動算出→Index
  const withIdx=clients.map(r=>{const f=derive(r);return {...r,...f,score:idx(f)};});
  const c=withIdx[Math.min(sel,withIdx.length-1)]||withIdx[0];
  // 業界中央値(同業界の集団から算出。1社ならその値)
  const peers=withIdx.filter(x=>x.industry===c.industry);
  const med=k=>{const a=peers.map(p=>p[k]).sort((x,y)=>x-y);const n=a.length;return n?Math.round(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0;};
  const median=FKEY.map(k=>med(k));
  const medScore=Math.round(median.reduce((a,b)=>a+b,0)/4*10)/10;
  const own=FKEY.map(k=>c[k]);
  const rank=[...peers].sort((a,b)=>b.score-a.score).findIndex(p=>p.id===c.id)+1;
  const [lvl,lvlc]=level(c.score);
  const diff=(c.score-medScore).toFixed(1);
  const weak=FKEY.map((k,i)=>({k,i,jp:FK[i],v:c[k],gap:median[i]-c[k],tip:TIP[k]})).sort((a,b)=>a.v-b.v);
  const losing=weak.filter(w=>w.gap>0).sort((a,b)=>b.gap-a.gap);
  const upd=(i,k,v)=>setClients(cs=>cs.map((x,j)=>j===i?{...x,[k]:(k==="company"||k==="industry")?v:(Number(v)||0)}:x));
  const del=i=>setClients(cs=>cs.filter((_,j)=>j!==i));
  const add=()=>setClients(cs=>[...cs,{id:Date.now(),company:"新規クライアント",industry:"IT",users:100,wauUsers:40,depts:8,useDepts:3,stage:2,govItems:5}]);

  return (<div className="wrap"><DataBar/>
    <h1>AI顧問オペレーションOS <span className="sub">クライアントのAI活用を採点・比較し、次アクションを提示</span></h1>

    <div className="card" style={{background:"#fdfcff"}}>
      <h2>4つの指標は何を見ている？ <span className="sub">（主観で点数をつけません。数えられる事実から自動計算します）</span></h2>
      <table style={{marginTop:6}}><thead><tr><th className="l" style={{width:"14%"}}>指標</th><th className="l">何を知りたいか</th><th className="l">何を数えるか（測り方）</th><th className="l">点数の付け方</th></tr></thead>
        <tbody>{DEF.map((d,i)=>(<tr key={i}>
          <td className="l"><b>{d.k}</b></td><td className="l">{d.q}</td><td className="l">{d.how}</td>
          <td className="l">{d.calc}<br/><span className="sub">例: {d.ex}</span></td></tr>))}
        </tbody></table>
      <div className="src">
        <b>なぜこう決めたか</b>
        <div>・「幅」「深さ」のような曖昧な言葉は<b>人によって基準が変わる</b>ため、点数を直接入力させる設計をやめました。</div>
        <div>・代わりに<b>誰が数えても同じ答えになる事実</b>（人数・部署数・到達段階・チェック項目数）だけを入力し、点数は自動計算します。</div>
        <div>・「活用の深さ」の4段階は<b>当社が定義した基準</b>です（公的な標準ではありません）。段階の定義を自社の実情に合わせて変更してもかまいません。</div>
      </div>
    </div>

    <div className="card">
      <div className="real">✏️ <b>数えられる事実を入力</b>してください（行クリックで下の詳細に反映）。右側の4因子とIndexは<b>入力値から自動計算</b>されます。</div>
      <table><thead><tr>
        <th className="l">企業</th><th>業界</th>
        <th>対象者<br/><span className="sub">人</span></th><th>週1回以上<br/>使った人</th>
        <th>全部署<br/><span className="sub">数</span></th><th>使っている<br/>部署数</th>
        <th>到達段階<br/><span className="sub">①〜④</span></th><th>ルール<br/><span className="sub">/10項目</span></th>
        <th>Index</th><th>状態</th><th></th></tr></thead>
        <tbody>{withIdx.map((x,i)=>{const [st,cc]=tri(x.score);return (<tr key={x.id} className={"clk"+(i===sel?" sel":"")} onClick={()=>setSel(i)}>
          <td className="l"><input className="nm" value={x.company} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"company",e.target.value)}/></td>
          <td><select value={x.industry} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"industry",e.target.value)}>{IND.map(s=>(<option key={s}>{s}</option>))}</select></td>
          <td><input value={x.users} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"users",e.target.value)}/></td>
          <td><input value={x.wauUsers} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"wauUsers",e.target.value)}/></td>
          <td><input value={x.depts} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"depts",e.target.value)}/></td>
          <td><input value={x.useDepts} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"useDepts",e.target.value)}/></td>
          <td><select value={x.stage} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"stage",e.target.value)}>
            {[0,1,2,3,4].map(s=>(<option key={s} value={s}>{STAGE[s]}</option>))}</select></td>
          <td><input value={x.govItems} onClick={e=>e.stopPropagation()} onChange={e=>upd(i,"govItems",e.target.value)}/></td>
          <td><b>{x.score.toFixed(1)}</b></td>
          <td><span className="pill" style={{background:cc+"22",color:cc}}>{st}</span></td>
          <td><button className="del" onClick={e=>{e.stopPropagation();del(i);}}>×</button></td></tr>);})}
        </tbody></table>
      <button className="add" onClick={add}>＋ クライアント追加</button>
      <button className="ghost" onClick={()=>setClients(CL0)}>サンプルに戻す</button>
    </div>

    <div className="card">
      <h2>{c.company} の点数の計算過程（なぜこの点数か）</h2>
      <table><thead><tr><th className="l">指標</th><th className="l">入力した事実</th><th className="l">計算</th><th>点数</th></tr></thead>
        <tbody>
          <tr><td className="l"><b>利用・定着</b></td><td className="l">対象{c.users}名のうち、週1回以上使った人 {c.wauUsers}名</td>
            <td className="l">{c.wauUsers} ÷ {c.users} = {c.users>0?(c.wauUsers/c.users*100).toFixed(1):0}%</td><td><b>{c.util}</b></td></tr>
          <tr><td className="l"><b>活用の幅</b></td><td className="l">全{c.depts}部署のうち、使っている部署 {c.useDepts}部署</td>
            <td className="l">{c.useDepts} ÷ {c.depts} = {c.depts>0?(c.useDepts/c.depts*100).toFixed(1):0}%</td><td><b>{c.breadth}</b></td></tr>
          <tr><td className="l"><b>活用の深さ</b></td><td className="l">到達段階: <b>{STAGE[Math.min(4,Math.max(0,c.stage))]}</b></td>
            <td className="l">段階{Math.min(4,Math.max(0,c.stage))} × 25点</td><td><b>{c.depth}</b></td></tr>
          <tr><td className="l"><b>ガバナンス</b></td><td className="l">必須10項目のうち {c.govItems}項目を整備</td>
            <td className="l">{c.govItems} × 10点</td><td><b>{c.gov}</b></td></tr>
          <tr style={{background:"#f7f3fd"}}><td className="l"><b>Index</b></td><td className="l" colSpan="2">4指標の平均 = ({c.util}+{c.breadth}+{c.depth}+{c.gov}) ÷ 4</td><td><b>{c.score.toFixed(1)}</b></td></tr>
        </tbody></table>
    </div>

    <div className="card" style={{display:"flex",gap:24,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
      <div>
        <h2>{c.company} の AI活用Index</h2>
        <div className="big">{c.score.toFixed(1)} <span style={{fontSize:16,color:"#8a8f9c"}}>/100</span></div>
        <span className="lvl" style={{background:lvlc}}>水準: {lvl}</span>
        <div style={{marginTop:8,fontSize:14}}>業界({c.industry})中央値 {medScore} より <b className={diff>=0?"up":"down"}>{diff>=0?"+"+diff:diff}点</b>
          {peers.length>1 && <span> ／ 同業界{peers.length}社中 <b>{rank}位</b></span>}</div>
        {peers.length<3
          ? <div style={{background:"#fff4e0",border:"1px solid #f0d98a",borderRadius:8,padding:"9px 11px",fontSize:12.5,color:"#8a6100",lineHeight:1.7,marginTop:8}}>
              <b>⚠ 「業界中央値」はまだ比較として使えません</b><br/>
              同じ業界({c.industry})の登録が<b>{peers.length}社</b>しかないため、中央値は
              {peers.length===1?"この会社自身の値そのもの":"ごく少数の値"}です。<b>上の「◯点 上/下」は意味を持ちません。</b>
              同業界を3社以上（できれば5社以上）登録してからご覧ください。
            </div>
          : <div className="sub">※中央値は登録済みの同業界{peers.length}社から算出した値です（公的な業界統計ではありません）。社数が増えるほど安定します。</div>}
      </div>
      <div><Radar own={own} median={median}/><div className="sub" style={{textAlign:"center"}}>■当該社 ／ ┈業界中央値</div></div>
    </div>

    <div className="card">
      <div className="ai"><b>🤖 トリアージ・顧問コメント</b><br/>
        {c.score<40?<span><b>要介入</b>：まず定着の土台づくりが急務。</span>:c.score<60?<span><b>要注視</b>：伸ばせば標準以上へ届く水準。</span>:<span><b>良好</b>：さらに深さ・幅を伸ばして先進レベルへ。</span>}
        最も弱い因子は <b>{weak[0].jp}</b>({weak[0].v}点)。
        {losing.length?<span>業界中央値に届いていない{losing.length}因子を底上げすると Index を <b>+{(losing.reduce((a,x)=>a+x.gap,0)/4).toFixed(1)}点</b>改善できます。</span>:<span>全因子で業界中央値以上です。</span>}
      </div>
      <div className="plan">
        <div style={{fontWeight:"bold",color:"#6a4c93",marginTop:4}}>顧問アクション（弱い順）</div>
        <ul>{weak.slice(0,3).map((w,k)=>(<li key={k}><b>{w.jp}</b>：{w.v}点{w.gap>0?<span>（中央値まで<span className="up">+{w.gap}</span>）</span>:<span>（中央値以上 ✓）</span>} — {w.tip}</li>))}</ul>
      </div>
    </div>

    <p className="note">※Indexは4因子の単純平均、業界中央値は入力された同業界クライアントの中央値です。実運用では月次の実測値(WAU・ユースケース数・研修受講率・ルール整備率など)を接続します。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}
function Footer(){
  return (<div className="wrap" style={{margin:"24px auto 8px",fontSize:11.5,color:"#8a8f9c",lineHeight:1.9,
      borderTop:"1px solid #e0e6ec",paddingTop:12}}>
    <div><b style={{color:"#556"}}>提供</b>：株式会社デジタルアイデンティティ</div>
    <div><b style={{color:"#556"}}>データの取り扱い</b>：入力された内容は<b>お使いの端末の中だけ</b>に保存されます。当社のサーバーへ送信・保存されることはありません。端末を共有している場合は、画面上の「最初に戻す」で消去してください。</div>
    <div><b style={{color:"#556"}}>ご利用にあたって</b>：本ツールの計算結果は<b>判断の材料</b>であり、成果を保証するものではありません。最終的な意思決定はご自身の責任で行ってください。本ツールの利用により生じた損害について、当社は責任を負いかねます。</div>
    <div className="printonly">印刷日: {new Date().toLocaleDateString("ja-JP")}</div>
  </div>);
}
function Root(){return (<React.Fragment><ShareBar/><ActionBar/><App/><Footer/></React.Fragment>);}


// ===== サーバー保管・複数人共有 =====
const API="https://di-tools-api.vercel.app/api/workspace";
function qs(k){try{return new URLSearchParams(location.search).get(k)||"";}catch(e){return "";}}
function ShareBar(){
  const [busy,setBusy]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  const [info,setInfo]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":__share");return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [who,setWho]=React.useState(function(){
    try{return localStorage.getItem("di_who")||"";}catch(e){return "";}
  });
  const [loaded,setLoaded]=React.useState(null);
  const [title,setTitle]=React.useState("");

  // 共有リンクで開かれた場合はサーバーから読み込む
  React.useEffect(function(){
    var id=qs("ws"); if(!id)return;
    var key=qs("key");
    setBusy(true);
    fetch(API+"?id="+encodeURIComponent(id))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg("読み込めませんでした: "+j.error);setBusy(false);return;}
        Object.keys(j.data||{}).forEach(function(k){
          localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));
        });
        if(key)localStorage.setItem(STORE+":__share",JSON.stringify({id:id,editKey:key}));
        setLoaded({title:j.title,updatedBy:j.updatedBy,updatedAt:j.updatedAt,canEdit:!!key});
        // 取り込んだ内容を反映するため再読込（?ws= は外す）
        if(!sessionStorage.getItem("di_loaded_"+id)){
          sessionStorage.setItem("di_loaded_"+id,"1");
          location.replace(location.pathname);
        }
        setBusy(false);
      })
      .catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  },[]);

  const remember=function(v){setWho(v);try{localStorage.setItem("di_who",v);}catch(e){}};
  const body=function(){
    return {tool:STORE, title:title||document.title, who:who,
      data:(typeof collectAll==="function"?collectAll():{})};
  };
  const create=function(){
    setBusy(true);setMsg("");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        var nx={id:j.id,editKey:j.editKey};
        localStorage.setItem(STORE+":__share",JSON.stringify(nx));
        setInfo(nx);setMsg("サーバーに保存しました");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const update=function(){
    if(!info)return create();
    setBusy(true);setMsg("");
    fetch(API+"?id="+info.id+"&key="+info.editKey,{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        setMsg("サーバーに保存しました（"+new Date().toLocaleTimeString("ja-JP")+"）");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const linkView=info?(location.origin+location.pathname+"?ws="+info.id):"";
  const linkEdit=info?(linkView+"&key="+info.editKey):"";
  const copy=function(t,label){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){setMsg(label+"をコピーしました");
        setTimeout(function(){setMsg("");},3000);});
    }else{
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");setMsg(label+"をコピーしました");}catch(e){}
      document.body.removeChild(ta);
    }
  };
  const bs={border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontSize:12.5};
  return (<div className="noprint" style={{background:"#eef4fb",border:"1px solid #c5d8f5",borderRadius:10,
      padding:"10px 12px",margin:"0 0 12px",fontSize:13,color:"#1a4d8f"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span>☁️ <b>サーバーに保存して、チームで共有できます</b></span>
      <span style={{flex:1}}></span>
      <input value={who} onChange={function(e){remember(e.target.value);}} placeholder="お名前（任意）"
        style={{border:"1px solid #b9cbe4",borderRadius:6,padding:"6px 8px",fontSize:12.5,width:120}}/>
      {!info && <button onClick={create} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"サーバーに保存"}</button>}
      {info && <button onClick={update} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"変更を保存"}</button>}
    </div>
    {loaded && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px"}}>
      📥 共有リンクから読み込みました{loaded.updatedBy?"（最終更新: "+loaded.updatedBy+"）":""}。
      {loaded.canEdit?"このリンクは編集できます。":"このリンクは閲覧専用です（変更しても他の人には反映されません）。"}
    </div>}
    {info && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px",lineHeight:2}}>
      <div><b>閲覧用リンク</b>（見るだけ）
        <button onClick={function(){copy(linkView,"閲覧用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkView}</div></div>
      <div style={{marginTop:6}}><b>編集用リンク</b>（変更もできる／取扱注意）
        <button onClick={function(){copy(linkEdit,"編集用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkEdit}</div></div>
    </div>}
    {msg && <div style={{marginTop:6,fontWeight:"bold"}}>{msg}</div>}
    <div style={{marginTop:6,fontSize:11.5,color:"#5b7fb0"}}>
      ※「サーバーに保存」を押したときだけ送信されます。押さなければ、これまで通り端末内だけで処理されます。
    </div>
  </div>);
}

</script>
